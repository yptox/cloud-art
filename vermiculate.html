<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vermiculate — reaction-diffusion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ===========================================================
     PHOSPHOR TERMINAL THEME — matches yptox.com / nointernet.com.au
     #1a1a1a base · #00ff00 phosphor · VT323 + Press Start 2P
     cyan #6bc7ff accent (from no-internet)
     =========================================================== */
  :root{
    --bg:#1a1a1a;            /* yptox terminal base */
    --bg-deep:#0c0c0c;
    --panel:#141414;
    --panel-soft:#0e120e;
    --ink:#00ff00;           /* phosphor green */
    --ink-soft:#19c219;
    --muted:#3f8f3f;         /* dim green */
    --line:#1f3d1f;          /* green hairline */
    --line-dash:#2f5a2f;
    --accent:#39ff14;        /* bright phosphor accent */
    --accent-deep:#008f11;   /* yptox accent green */
    --accent-wash:#0c2a12;   /* dark green wash */
    --cyan:#6bc7ff;          /* no-internet cyan */
    --cyan-deep:#2f6f9e;
    --glow:0 0 6px rgba(0,255,0,.45);
    --mono:'VT323',ui-monospace,monospace;
    --pixel:'Press Start 2P',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--mono);
    color:var(--ink);
    background:var(--bg);
    font-size:19px;
    -webkit-font-smoothing:antialiased;
  }
  /* CRT scanline overlay — subtle, leaves the art legible */
  body::after{
    content:"";position:fixed;inset:0;z-index:9998;pointer-events:none;
    background:repeating-linear-gradient(0deg,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.13) 3px, rgba(0,0,0,0) 4px);
    opacity:.55;
  }
  ::selection{background:var(--accent-deep);color:#000}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;gap:14px;
    padding:13px 24px;
    background:#111;
    border-bottom:2px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  .mark{flex:0 0 auto;display:block;filter:drop-shadow(0 0 5px rgba(0,255,0,.55))}
  .titlewrap{display:flex;flex-direction:column;gap:7px;line-height:1}
  .title{
    font-family:var(--pixel);font-weight:400;font-size:15px;letter-spacing:1px;
    color:var(--ink);text-shadow:0 0 9px rgba(0,255,0,.55);
  }
  .subtitle{font-family:var(--mono);font-size:17px;color:var(--muted);letter-spacing:.5px}
  .header-spacer{flex:1}
  .badge{
    font-family:var(--mono);font-size:16px;color:var(--cyan);
    border:1px solid var(--cyan-deep);border-radius:0;padding:2px 10px;background:#0b1620;
    letter-spacing:1px;
  }
  .badge::before{content:"[ "}
  .badge::after{content:" ]"}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:calc(100vh - 60px)}
  aside{
    width:336px;flex:0 0 336px;
    background:var(--panel);
    border-right:2px solid var(--line);
    padding:22px 20px 30px;
    overflow-y:auto;height:calc(100vh - 60px);
    position:sticky;top:60px;
  }
  main{
    flex:1;display:flex;align-items:center;justify-content:center;padding:34px;
    background:
      radial-gradient(900px 620px at 50% -12%, #14210f 0%, rgba(20,33,15,0) 62%),
      #0c0c0c;
  }
  .stage{
    width:min(82vh, 100%);max-width:860px;aspect-ratio:1/1;
    border-radius:0;overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 0 0 1px #000, 0 0 52px rgba(0,255,0,.08), inset 0 0 40px rgba(0,0,0,.55);
    background:#000;position:relative;cursor:crosshair;
  }
  .stage canvas{width:100% !important;height:100% !important;display:block}

  /* ---------- Pills (status overlays) ---------- */
  .progress-pill,.info-pill,.julia-pill{
    position:absolute;bottom:14px;z-index:3;
    display:flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:15px;
    color:var(--ink);background:rgba(6,16,6,.80);
    border:1px solid var(--line);
    padding:3px 11px;border-radius:0;letter-spacing:.5px;
    pointer-events:none;transition:opacity .4s;
    text-shadow:0 0 5px rgba(0,255,0,.4);
  }
  .progress-pill,.info-pill{left:14px}
  .julia-pill{right:14px;display:none}
  .info-pill span{opacity:.55}
  .progress-pill .bar{width:74px;height:8px;border-radius:0;background:#0c2a12;border:1px solid var(--line);overflow:hidden}
  .progress-pill .bar i{display:block;height:100%;width:0%;background:var(--accent);box-shadow:0 0 8px var(--accent);transition:width .12s linear}

  /* ---------- Sidebar sections ---------- */
  .section{margin-bottom:24px}
  .section-head{
    font-family:var(--pixel);font-weight:400;font-size:10px;letter-spacing:1px;
    text-transform:uppercase;color:var(--accent-deep);margin:0 0 15px;
    display:flex;align-items:center;gap:10px;
    text-shadow:0 0 7px rgba(0,143,17,.5);
  }
  .section-head::before{content:"//"}
  .section-head::after{content:"";flex:1;height:0;border-top:1px dashed var(--line-dash)}

  /* Seed */
  .seed-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .seed-display{
    flex:1;font-family:var(--mono);font-weight:400;font-size:27px;
    background:#0a0f0a;border:1px solid var(--line);border-radius:0;
    padding:2px 14px;text-align:center;letter-spacing:3px;color:var(--ink);
    text-shadow:var(--glow);
  }
  .iconbtn{
    width:40px;height:40px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel-soft);
    border-radius:0;cursor:pointer;font-size:20px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;transition:.12s;font-family:var(--mono);
  }
  .iconbtn:hover{background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent);box-shadow:var(--glow)}
  .iconbtn:active{transform:translateY(1px)}
  .seed-jump{display:flex;gap:8px}
  .seed-jump input{
    flex:1;min-width:0;font-family:var(--mono);font-size:19px;
    border:1px solid var(--line);border-radius:0;padding:3px 12px;background:#0a0f0a;color:var(--ink);
  }
  .seed-jump input:focus{outline:none;border-color:var(--accent-deep);box-shadow:0 0 0 1px var(--accent-deep),0 0 10px rgba(0,255,0,.25)}

  /* Buttons (bracketed, terminal style) */
  .btn{
    font-family:var(--mono);font-weight:400;font-size:19px;cursor:pointer;
    border-radius:0;padding:3px 14px;border:1px solid var(--line);background:var(--panel-soft);
    color:var(--ink);transition:.12s;letter-spacing:.5px;
  }
  .btn:hover{background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent);box-shadow:var(--glow)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#0a0f0a}

  /* preset / mode chips */
  .presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
  .preset-btn{
    font-family:var(--mono);font-size:18px;font-weight:400;
    padding:1px 11px;border:1px solid var(--line);border-radius:0;
    background:var(--panel-soft);color:var(--ink);cursor:pointer;transition:.12s;letter-spacing:.5px;
  }
  .preset-btn:hover{background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent)}
  .preset-btn.active{background:#0b1620;border-color:var(--cyan-deep);color:var(--cyan);box-shadow:0 0 8px rgba(107,199,255,.3)}
  .mode-row{display:flex;gap:8px;margin-bottom:8px}
  .mode-btn{
    flex:1;font-family:var(--mono);font-size:19px;font-weight:400;
    padding:4px 8px;border:1px solid var(--line);border-radius:0;
    background:var(--panel-soft);color:var(--ink);cursor:pointer;transition:.12s;text-align:center;
  }
  .mode-btn:hover{background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent)}
  .mode-btn.active{background:#0b1620;border-color:var(--cyan-deep);color:var(--cyan);box-shadow:0 0 8px rgba(107,199,255,.3)}

  /* bracket decoration on actionable text buttons */
  .btn::before,.preset-btn::before,.mode-btn::before{content:"[ ";opacity:.5}
  .btn::after,.preset-btn::after,.mode-btn::after{content:" ]";opacity:.5}

  .julia-c-row{
    font-family:var(--mono);font-size:17px;color:var(--muted);
    background:#0a0f0a;border:1px solid var(--line);border-radius:0;
    padding:6px 12px;display:none;
  }
  .julia-c-row.show{display:block}
  .julia-c-val{font-weight:400;color:var(--cyan)}

  /* Parameters */
  .control-group{margin-bottom:14px}
  .control-group label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:19px;color:var(--ink);margin-bottom:5px;letter-spacing:.5px;
  }
  .value-display{
    font-family:var(--mono);font-weight:400;font-size:17px;color:var(--cyan);
    background:#0b1620;border:1px solid var(--cyan-deep);border-radius:0;padding:0 8px;min-width:48px;text-align:center;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:0;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--fill,40%),#0c2a12 var(--fill,40%),#0c2a12 100%);
    border:1px solid var(--line);
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:20px;border-radius:0;
    background:var(--ink);border:1px solid #003f00;box-shadow:0 0 8px rgba(0,255,0,.65);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:20px;border-radius:0;background:var(--ink);border:1px solid #003f00;
    box-shadow:0 0 8px rgba(0,255,0,.65);cursor:pointer;
  }
  input[type=range]::-moz-range-track{height:8px;border-radius:0;background:#0c2a12}

  /* Palette swatches */
  .swatches{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .swatch{
    width:34px;height:34px;border-radius:0;cursor:pointer;border:1px solid var(--line);
    box-shadow:0 0 0 1px #000;transition:.12s;position:relative;
  }
  .swatch:hover{transform:translateY(-2px);box-shadow:0 0 10px rgba(0,255,0,.3)}
  .swatch.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 10px rgba(107,199,255,.4)}

  /* Colour pickers (crenate) */
  .color-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .color-cell{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:18px;color:var(--muted)}
  .color-cell input[type=color]{
    -webkit-appearance:none;appearance:none;width:30px;height:30px;border:none;border-radius:0;
    background:none;cursor:pointer;padding:0;flex:0 0 auto;
  }
  .color-cell input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .color-cell input[type=color]::-webkit-color-swatch{border:1px solid var(--line);border-radius:0}
  .color-cell input[type=color]::-moz-color-swatch{border:1px solid var(--line);border-radius:0}

  /* Actions */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions .btn{width:100%;text-align:center}
  .actions .primary{
    grid-column:1 / -1;background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent);font-weight:400;
    text-shadow:var(--glow);
  }
  .actions .primary:hover{background:#0f3a18;border-color:var(--accent);box-shadow:0 0 14px rgba(0,255,0,.35)}

  .hint{font-family:var(--mono);font-size:17px;color:var(--muted);margin-top:14px;line-height:1.4;letter-spacing:.3px}
  .hint::before{content:"> ";color:var(--accent-deep)}

  /* error overlay (vermiculate) */
  .err{display:none;position:absolute;inset:0;background:#0a0a0a;color:#ff5f56;font-family:var(--mono);font-size:19px;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.6}
  .err.show{display:flex}

  aside::-webkit-scrollbar{width:12px}
  aside::-webkit-scrollbar-track{background:#0b0b0b}
  aside::-webkit-scrollbar-thumb{background:#1f3d1f;border-radius:0;border:3px solid var(--panel)}

  @media (max-width:880px){
    .app{flex-direction:column}
    aside{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:2px solid var(--line)}
    main{padding:18px}
  }
</style>
</head>
<body>

<header>
  <svg class="mark" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
    <g fill="none" stroke="#00ff00" stroke-width="2" stroke-linecap="round">
      <path d="M15 3 C 9 9, 21 9, 15 15 C 9 21, 21 21, 15 27"/>
      <path d="M3 15 C 9 9, 9 21, 15 15 C 21 9, 21 21, 27 15"/>
    </g>
  </svg>
  <div class="titlewrap">
    <span class="title">Vermiculate</span>
    <span class="subtitle">reaction-diffusion — two chemicals, an eternal dance</span>
  </div>
  <div class="header-spacer"></div>
  <span class="badge">generative · seeded · WebGL</span>
</header>

<div class="app">
<aside>

  <div class="section">
    <p class="section-head">Seed</p>
    <div class="seed-row">
      <button class="iconbtn" id="btn-prev" title="Previous seed (←)">&#8249;</button>
      <div class="seed-display" id="seed-display">1952</div>
      <button class="iconbtn" id="btn-next" title="Next seed (→)">&#8250;</button>
      <button class="iconbtn" id="btn-rand" title="Random seed">&#9861;</button>
    </div>
    <div class="seed-jump">
      <input type="number" id="seed-input" min="1" max="99999" placeholder="Jump to…">
      <button class="btn" id="btn-jump">Go</button>
    </div>
  </div>

  <div class="section">
    <p class="section-head">Pattern</p>
    <div class="presets" id="preset-list"></div>
  </div>

  <div class="section">
    <p class="section-head">Chemistry</p>
    <div class="control-group">
      <label>Feed rate <span class="value-display" id="val-f">0.0545</span></label>
      <input type="range" id="sl-f" min="0.010" max="0.100" step="0.0005" value="0.0545">
    </div>
    <div class="control-group">
      <label>Kill rate <span class="value-display" id="val-k">0.0620</span></label>
      <input type="range" id="sl-k" min="0.040" max="0.075" step="0.0005" value="0.0620">
    </div>
    <div class="control-group">
      <label>Speed <span class="value-display" id="val-speed">12</span></label>
      <input type="range" id="sl-speed" min="1" max="40" step="1" value="12">
    </div>
  </div>

  <div class="section">
    <p class="section-head">Palette</p>
    <div class="swatches" id="palette-list"></div>
  </div>

  <div class="section">
    <p class="section-head">Actions</p>
    <div class="actions">
      <button class="btn primary" id="btn-playpause">Pause</button>
      <button class="btn ghost" id="btn-reset">Reset</button>
      <button class="btn ghost" id="btn-download">Download PNG</button>
    </div>
    <p class="hint">Scroll to zoom &middot; drag to pan &middot; click to disturb the field. Arrow keys step seeds.</p>
  </div>

</aside>

<main>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="err" id="err-msg"></div>
    <div class="info-pill" id="info-pill">
      <span id="info-step">step 0</span>
      <span id="info-zoom">1.0×</span>
    </div>
  </div>
</main>
</div>

<script>
'use strict';

/* ======================================================
   CONFIGURATION
   ====================================================== */
const SIM = 512;   // simulation grid size (square)
const DEFAULT_SEED = 1952;  // year Turing's morphogenesis paper was published

const PRESETS = [
  { name:'Coral',    f:0.0545, k:0.0620 },
  { name:'Maze',     f:0.0290, k:0.0570 },
  { name:'Spots',    f:0.0350, k:0.0650 },
  { name:'Worms',    f:0.0780, k:0.0610 },
  { name:'Bubbles',  f:0.0980, k:0.0570 },
  { name:'Mitosis',  f:0.0270, k:0.0510 },
];

const PALETTES = [
  { name:'Phosphor', c:['#040804','#0a3d16','#179a2b','#4dff4a','#cfffce'] },
  { name:'Vellum',   c:['#EFE7D6','#D9A86E','#C86030','#7A2E0E','#20100A'] },
  { name:'Tidepool', c:['#0A1620','#163850','#2E7E8E','#7BC8D4','#CFF3EC'] },
  { name:'Foxglove', c:['#F6F1F3','#E0B0C8','#C16A8E','#7A2E6E','#260F2A'] },
  { name:'Lichen',   c:['#0C1208','#2A4E1E','#5C9232','#AACF5A','#EEF2D8'] },
  { name:'Cinder',   c:['#10100E','#5A2010','#B44020','#E8A030','#FBF5D8'] },
  { name:'Glacier',  c:['#EEF3F5','#A8C8E0','#5080A0','#284870','#0C1828'] },
];

/* ======================================================
   GLSL SHADERS
   ====================================================== */

const VERT_SRC = `#version 300 es
in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

// Seed the initial state from a hash-based PRNG
const INIT_SRC = `#version 300 es
precision highp float;
uniform float u_seed;
out vec4 fragColor;

float h(vec2 p, float s) {
  p = fract(p * vec2(127.1, 311.7) + s * 0.13719);
  p += dot(p, p + 45.32);
  return fract(p.x * p.y * 43758.5);
}

void main() {
  vec2 uv = gl_FragCoord.xy / ${SIM}.0;
  float A = 1.0, B = 0.0;
  for (int i = 0; i < 30; i++) {
    float fi = float(i);
    float sx = h(vec2(fi * 0.137, 0.0), u_seed);
    float sy = h(vec2(fi * 0.137, 1.0), u_seed);
    float sr = h(vec2(fi * 0.137, 2.0), u_seed) * 0.05 + 0.012;
    float dist = length(uv - vec2(sx, sy));
    if (dist < sr) { A = 0.5; B = 0.25; }
  }
  fragColor = vec4(A, B, 0.0, 1.0);
}`;

// Gray-Scott reaction-diffusion step
const COMP_SRC = `#version 300 es
precision highp float;
uniform sampler2D u_state;
uniform float u_f, u_k, u_Da, u_Db, u_dt;
out vec4 fragColor;

void main() {
  ivec2 sz = textureSize(u_state, 0);
  ivec2 p  = ivec2(gl_FragCoord.xy);
  ivec2 pU = ivec2(p.x, (p.y + 1) % sz.y);
  ivec2 pD = ivec2(p.x, (p.y - 1 + sz.y) % sz.y);
  ivec2 pL = ivec2((p.x - 1 + sz.x) % sz.x, p.y);
  ivec2 pR = ivec2((p.x + 1) % sz.x, p.y);

  vec2 s  = texelFetch(u_state, p,  0).rg;
  vec2 sU = texelFetch(u_state, pU, 0).rg;
  vec2 sD = texelFetch(u_state, pD, 0).rg;
  vec2 sL = texelFetch(u_state, pL, 0).rg;
  vec2 sR = texelFetch(u_state, pR, 0).rg;

  vec2 lap = sU + sD + sL + sR - 4.0 * s;

  float A = s.r, B = s.g, abb = A * B * B;
  float nA = A + u_dt * (u_Da * lap.r - abb + u_f * (1.0 - A));
  float nB = B + u_dt * (u_Db * lap.g + abb - (u_f + u_k) * B);

  fragColor = vec4(clamp(nA, 0.0, 1.0), clamp(nB, 0.0, 1.0), 0.0, 1.0);
}`;

// Display pass: color mapping + zoom/pan + toroidal infinite wrap
const DISP_SRC = `#version 300 es
precision mediump float;
uniform sampler2D u_state;
uniform vec2 u_pan;
uniform float u_zoom;
uniform vec2 u_displaySize;
uniform vec3 u_pal[5];
out vec4 fragColor;

vec3 palette(float t) {
  t = clamp(t, 0.0, 1.0) * 4.0;
  int i = int(floor(t));
  float f = fract(t);
  if (i == 0) return mix(u_pal[0], u_pal[1], f);
  if (i == 1) return mix(u_pal[1], u_pal[2], f);
  if (i == 2) return mix(u_pal[2], u_pal[3], f);
  return mix(u_pal[3], u_pal[4], f);
}

void main() {
  vec2 screenUV = gl_FragCoord.xy / u_displaySize;
  // Pan/zoom: u_pan is center of view in [0,1] sim space, u_zoom > 1 = zoomed in
  vec2 simUV = u_pan + (screenUV - 0.5) / u_zoom;
  simUV = fract(simUV);  // toroidal infinite tiling

  float B = texture(u_state, simUV).g;
  float t = clamp(B * 3.0, 0.0, 1.0);

  // Soft vignette
  vec2 vd = screenUV - 0.5;
  float vig = 1.0 - smoothstep(0.35, 0.72, length(vd) * 1.4);

  fragColor = vec4(palette(t) * mix(0.7, 1.0, vig), 1.0);
}`;

// Paint shader: disturb the field at mouse position
const PAINT_SRC = `#version 300 es
precision highp float;
uniform sampler2D u_state;
uniform vec2 u_simPos;  // in [0,1] sim UV
uniform float u_radius; // in sim UV units
out vec4 fragColor;

void main() {
  ivec2 sz = textureSize(u_state, 0);
  ivec2 p = ivec2(gl_FragCoord.xy);
  vec2 uv = (vec2(p) + 0.5) / vec2(sz);

  vec2 s = texelFetch(u_state, p, 0).rg;
  float d = length(uv - u_simPos);
  if (d < u_radius) {
    float w = 1.0 - d / u_radius;
    s.g = clamp(s.g + w * 0.3, 0.0, 1.0);
    s.r = clamp(s.r - w * 0.3, 0.0, 1.0);
  }
  fragColor = vec4(s.r, s.g, 0.0, 1.0);
}`;

/* ======================================================
   WEBGL SETUP
   ====================================================== */
const canvas = document.getElementById('c');
const errDiv  = document.getElementById('err-msg');

function showError(msg) {
  errDiv.textContent = msg;
  errDiv.classList.add('show');
}

const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true });
if (!gl) { showError('WebGL 2 is not available in this browser. Try Chrome, Firefox, or Safari 15+.'); }

const floatExt = gl && gl.getExtension('EXT_color_buffer_float');
if (gl && !floatExt) { showError('Float framebuffer textures are required (EXT_color_buffer_float).'); }

/* ======================================================
   SHADER UTILITIES
   ====================================================== */
function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    showError('Shader compile error — check console.');
    return null;
  }
  return s;
}

function makeProgram(vsSrc, fsSrc) {
  const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
  const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
  const p  = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    showError('Shader link error — check console.');
    return null;
  }
  return p;
}

function uniforms(prog) {
  const out = {};
  const n = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(prog, i);
    out[info.name] = gl.getUniformLocation(prog, info.name);
  }
  return out;
}

/* ======================================================
   QUAD (fullscreen triangle pair)
   ====================================================== */
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

function bindQuad(prog) {
  const loc = gl.getAttribLocation(prog, 'a_pos');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

/* ======================================================
   PROGRAMS
   ====================================================== */
let progInit, progComp, progDisp, progPaint;
let uInit, uComp, uDisp, uPaint;

if (gl && floatExt) {
  progInit  = makeProgram(VERT_SRC, INIT_SRC);
  progComp  = makeProgram(VERT_SRC, COMP_SRC);
  progDisp  = makeProgram(VERT_SRC, DISP_SRC);
  progPaint = makeProgram(VERT_SRC, PAINT_SRC);
  if (progInit && progComp && progDisp && progPaint) {
    uInit  = uniforms(progInit);
    uComp  = uniforms(progComp);
    uDisp  = uniforms(progDisp);
    uPaint = uniforms(progPaint);
  }
}

/* ======================================================
   TEXTURES + FRAMEBUFFERS
   ====================================================== */
function makeTexFB() {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, SIM, SIM, 0, gl.RGBA, gl.FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb };
}

let pingpong, cur;
if (gl && floatExt && progComp) {
  pingpong = [makeTexFB(), makeTexFB()];
  cur = 0;
}

/* ======================================================
   SIMULATION STATE
   ====================================================== */
let seed    = DEFAULT_SEED;
let preset  = PRESETS[0];
let palette = PALETTES[0];
let running = true;
let step    = 0;
let stepsPerFrame = 12;
let zoom    = 1.0;
let pan     = { x: 0.5, y: 0.5 };
let rafId   = null;

const DA = 0.2097, DB = 0.1050, DT = 1.0;

/* ======================================================
   CORE FUNCTIONS
   ====================================================== */
function hexToRgb01(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return [r, g, b];
}

function initSim(s) {
  if (!progInit) return;
  seed = s;
  step = 0;
  zoom = 1.0;
  pan  = { x: 0.5, y: 0.5 };

  gl.viewport(0, 0, SIM, SIM);
  gl.useProgram(progInit);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pingpong[0].fb);
  gl.uniform1f(uInit['u_seed'], seed);
  bindQuad(progInit);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // Copy to second buffer
  gl.bindFramebuffer(gl.FRAMEBUFFER, pingpong[1].fb);
  gl.uniform1f(uInit['u_seed'], seed);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  cur = 0;

  updateUI();
}

function simStep() {
  if (!progComp) return;
  gl.viewport(0, 0, SIM, SIM);
  gl.useProgram(progComp);
  const src = pingpong[cur];
  const dst = pingpong[1 - cur];
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fb);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, src.tex);
  gl.uniform1i(uComp['u_state'], 0);
  gl.uniform1f(uComp['u_f'],  preset.f);
  gl.uniform1f(uComp['u_k'],  preset.k);
  gl.uniform1f(uComp['u_Da'], DA);
  gl.uniform1f(uComp['u_Db'], DB);
  gl.uniform1f(uComp['u_dt'], DT);
  bindQuad(progComp);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  cur = 1 - cur;
  step++;
}

function display() {
  if (!progDisp) return;
  const W = canvas.width, H = canvas.height;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(progDisp);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, pingpong[cur].tex);
  const u = (name) => gl.getUniformLocation(progDisp, name);
  gl.uniform1i(u('u_state'), 0);
  gl.uniform2f(u('u_pan'), pan.x, pan.y);
  gl.uniform1f(u('u_zoom'), zoom);
  gl.uniform2f(u('u_displaySize'), W, H);
  // Array uniform: set all 5 stops at once via u_pal[0] location
  const flat = palette.c.flatMap(hex => hexToRgb01(hex));
  gl.uniform3fv(u('u_pal[0]'), flat);
  bindQuad(progDisp);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function paint(simUV) {
  if (!progPaint) return;
  gl.viewport(0, 0, SIM, SIM);
  gl.useProgram(progPaint);
  gl.bindFramebuffer(gl.FRAMEBUFFER, pingpong[1 - cur].fb);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, pingpong[cur].tex);
  gl.uniform1i(uPaint['u_state'], 0);
  gl.uniform2f(uPaint['u_simPos'], simUV.x, simUV.y);
  gl.uniform1f(uPaint['u_radius'], 0.04);
  bindQuad(progPaint);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  cur = 1 - cur;
}

/* ======================================================
   ANIMATION LOOP
   ====================================================== */
function animate() {
  if (canvas.width && canvas.height) {
    if (running) {
      for (let i = 0; i < stepsPerFrame; i++) simStep();
    }
    display();
  }
  updateInfoPill();
  rafId = requestAnimationFrame(animate);
}

/* ======================================================
   CANVAS SIZING
   ====================================================== */
function resizeCanvas() {
  const stage = document.getElementById('stage');
  const r = stage.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const sz = Math.round(Math.min(r.width, r.height) * dpr);
  if (canvas.width !== sz || canvas.height !== sz) {
    canvas.width  = sz;
    canvas.height = sz;
  }
}

/* ======================================================
   UI
   ====================================================== */
function updateUI() {
  document.getElementById('seed-display').textContent = seed;
  document.getElementById('sl-f').value  = preset.f;
  document.getElementById('val-f').textContent = preset.f.toFixed(4);
  setFill(document.getElementById('sl-f'));
  document.getElementById('sl-k').value  = preset.k;
  document.getElementById('val-k').textContent = preset.k.toFixed(4);
  setFill(document.getElementById('sl-k'));
  document.querySelectorAll('.preset-btn').forEach((b,i) => {
    b.classList.toggle('active', PRESETS[i] === preset);
  });
}

function updateInfoPill() {
  document.getElementById('info-step').textContent = 'step ' + step.toLocaleString();
  document.getElementById('info-zoom').textContent = zoom.toFixed(1) + '×';
}

function setFill(el) {
  const min = parseFloat(el.min), max = parseFloat(el.max), val = parseFloat(el.value);
  el.style.setProperty('--fill', ((val - min) / (max - min) * 100).toFixed(1) + '%');
}

function buildPresets() {
  const container = document.getElementById('preset-list');
  PRESETS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'preset-btn' + (i===0?' active':'');
    b.textContent = p.name;
    b.onclick = () => {
      preset = p;
      document.getElementById('sl-f').value = p.f;
      document.getElementById('val-f').textContent = p.f.toFixed(4);
      setFill(document.getElementById('sl-f'));
      document.getElementById('sl-k').value = p.k;
      document.getElementById('val-k').textContent = p.k.toFixed(4);
      setFill(document.getElementById('sl-k'));
      document.querySelectorAll('.preset-btn').forEach(b2 => b2.classList.remove('active'));
      b.classList.add('active');
    };
    container.appendChild(b);
  });
}

function buildPalettes() {
  const container = document.getElementById('palette-list');
  PALETTES.forEach((p, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i===0?' active':'');
    sw.title = p.name;
    sw.style.background = `linear-gradient(135deg, ${p.c[1]}, ${p.c[3]})`;
    sw.onclick = () => {
      palette = p;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    };
    container.appendChild(sw);
  });
}

/* ======================================================
   POINTER / ZOOM INTERACTION
   ====================================================== */
function canvasUVToSimUV(cx, cy) {
  const r = canvas.getBoundingClientRect();
  const nx = (cx - r.left) / r.width;
  const ny = 1.0 - (cy - r.top) / r.height;
  return {
    x: pan.x + (nx - 0.5) / zoom,
    y: pan.y + (ny - 0.5) / zoom,
  };
}

let isDragging = false, dragStart = null, panStart = null;
let isPainting = false;

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
  const r = canvas.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width;
  const my = 1.0 - (e.clientY - r.top) / r.height;
  const prevSimX = pan.x + (mx - 0.5) / zoom;
  const prevSimY = pan.y + (my - 0.5) / zoom;
  zoom = Math.max(0.5, Math.min(32, zoom * factor));
  pan.x = prevSimX - (mx - 0.5) / zoom;
  pan.y = prevSimY - (my - 0.5) / zoom;
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  if (e.button === 0 && e.shiftKey) {
    isPainting = true;
    paint(canvasUVToSimUV(e.clientX, e.clientY));
  } else if (e.button === 0) {
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    panStart  = { ...pan };
  }
});

canvas.addEventListener('mousemove', e => {
  if (isPainting) {
    paint(canvasUVToSimUV(e.clientX, e.clientY));
  } else if (isDragging) {
    const r = canvas.getBoundingClientRect();
    const dx = (e.clientX - dragStart.x) / r.width;
    const dy = -(e.clientY - dragStart.y) / r.height;
    pan.x = panStart.x - dx / zoom;
    pan.y = panStart.y - dy / zoom;
  }
});

canvas.addEventListener('mouseup',    () => { isDragging = false; isPainting = false; });
canvas.addEventListener('mouseleave', () => { isDragging = false; isPainting = false; });

canvas.addEventListener('click', e => {
  if (!e.shiftKey) paint(canvasUVToSimUV(e.clientX, e.clientY));
});

canvas.addEventListener('dblclick', () => { zoom = 1.0; pan = { x: 0.5, y: 0.5 }; });

/* ======================================================
   SEED NAVIGATION
   ====================================================== */
function setSeed(s) {
  s = Math.max(1, Math.min(99999, Math.round(s)));
  initSim(s);
}

document.getElementById('btn-prev').onclick = () => setSeed(seed - 1);
document.getElementById('btn-next').onclick = () => setSeed(seed + 1);
document.getElementById('btn-rand').onclick = () => setSeed(Math.floor(Math.random() * 9000) + 1000);
document.getElementById('btn-jump').onclick = () => {
  const v = parseInt(document.getElementById('seed-input').value);
  if (!isNaN(v)) setSeed(v);
};
document.getElementById('seed-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-jump').click();
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft')  setSeed(seed - 1);
  if (e.key === 'ArrowRight') setSeed(seed + 1);
});

/* ======================================================
   SLIDER WIRING
   ====================================================== */
function wireSlider(id, valId, digits, onChange) {
  const el = document.getElementById(id);
  function update() {
    const v = parseFloat(el.value);
    document.getElementById(valId).textContent = v.toFixed(digits);
    setFill(el);
    onChange(v);
  }
  el.addEventListener('input', update);
  setFill(el);
}

wireSlider('sl-f', 'val-f', 4, v => { preset = { ...preset, f: v }; });
wireSlider('sl-k', 'val-k', 4, v => { preset = { ...preset, k: v }; });
wireSlider('sl-speed', 'val-speed', 0, v => { stepsPerFrame = Math.round(v); });

/* ======================================================
   ACTION BUTTONS
   ====================================================== */
document.getElementById('btn-playpause').onclick = function() {
  running = !running;
  this.textContent = running ? 'Pause' : 'Play';
};

document.getElementById('btn-reset').onclick = () => initSim(seed);

document.getElementById('btn-download').onclick = () => {
  if (!running) display();  // ensure latest frame is on canvas
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = `vermiculate-seed${seed}-step${step}.png`;
  a.click();
};

/* ======================================================
   BOOTSTRAP
   ====================================================== */
buildPresets();
buildPalettes();

const ro = new ResizeObserver(() => { resizeCanvas(); });
ro.observe(document.getElementById('stage'));
resizeCanvas();

if (gl && floatExt && progComp) {
  initSim(DEFAULT_SEED);
  animate();
}
</script>
</body>
</html>
