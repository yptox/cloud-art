<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abyss — fractal infinite zoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ===========================================================
     PHOSPHOR TERMINAL THEME — matches yptox.com / nointernet.com.au
     #1a1a1a base · #00ff00 phosphor · VT323 + Press Start 2P
     cyan #6bc7ff accent (from no-internet)
     =========================================================== */
  :root{
    --bg:#1a1a1a;            /* yptox terminal base */
    --bg-deep:#0c0c0c;
    --panel:#141414;
    --panel-soft:#0e120e;
    --ink:#00ff00;           /* phosphor green */
    --ink-soft:#19c219;
    --muted:#3f8f3f;         /* dim green */
    --line:#1f3d1f;          /* green hairline */
    --line-dash:#2f5a2f;
    --accent:#39ff14;        /* bright phosphor accent */
    --accent-deep:#008f11;   /* yptox accent green */
    --accent-wash:#0c2a12;   /* dark green wash */
    --cyan:#6bc7ff;          /* no-internet cyan */
    --cyan-deep:#2f6f9e;
    --glow:0 0 6px rgba(0,255,0,.45);
    --mono:'VT323',ui-monospace,monospace;
    --pixel:'Press Start 2P',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--mono);
    color:var(--ink);
    background:var(--bg);
    font-size:19px;
    -webkit-font-smoothing:antialiased;
  }
  /* CRT scanline overlay — subtle, leaves the art legible */
  body::after{
    content:"";position:fixed;inset:0;z-index:9998;pointer-events:none;
    background:repeating-linear-gradient(0deg,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.13) 3px, rgba(0,0,0,0) 4px);
    opacity:.55;
  }
  ::selection{background:var(--accent-deep);color:#000}

  /* ---------- Header ---------- */
  header{
    display:flex;align-items:center;gap:14px;
    padding:13px 24px;
    background:#111;
    border-bottom:2px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  .mark{flex:0 0 auto;display:block;filter:drop-shadow(0 0 5px rgba(0,255,0,.55))}
  .titlewrap{display:flex;flex-direction:column;gap:7px;line-height:1}
  .title{
    font-family:var(--pixel);font-weight:400;font-size:15px;letter-spacing:1px;
    color:var(--ink);text-shadow:0 0 9px rgba(0,255,0,.55);
  }
  .subtitle{font-family:var(--mono);font-size:17px;color:var(--muted);letter-spacing:.5px}
  .header-spacer{flex:1}
  .badge{
    font-family:var(--mono);font-size:16px;color:var(--cyan);
    border:1px solid var(--cyan-deep);border-radius:0;padding:2px 10px;background:#0b1620;
    letter-spacing:1px;
  }
  .badge::before{content:"[ "}
  .badge::after{content:" ]"}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:calc(100vh - 60px)}
  aside{
    width:336px;flex:0 0 336px;
    background:var(--panel);
    border-right:2px solid var(--line);
    padding:22px 20px 30px;
    overflow-y:auto;height:calc(100vh - 60px);
    position:sticky;top:60px;
  }
  main{
    flex:1;display:flex;align-items:center;justify-content:center;padding:34px;
    background:
      radial-gradient(900px 620px at 50% -12%, #14210f 0%, rgba(20,33,15,0) 62%),
      #0c0c0c;
  }
  .stage{
    width:min(82vh, 100%);max-width:860px;aspect-ratio:1/1;
    border-radius:0;overflow:hidden;
    border:1px solid var(--line);
    box-shadow:0 0 0 1px #000, 0 0 52px rgba(0,255,0,.08), inset 0 0 40px rgba(0,0,0,.55);
    background:#000;position:relative;cursor:crosshair;
  }
  .stage canvas{width:100% !important;height:100% !important;display:block}

  /* ---------- Pills (status overlays) ---------- */
  .progress-pill,.info-pill,.julia-pill{
    position:absolute;bottom:14px;z-index:3;
    display:flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:15px;
    color:var(--ink);background:rgba(6,16,6,.80);
    border:1px solid var(--line);
    padding:3px 11px;border-radius:0;letter-spacing:.5px;
    pointer-events:none;transition:opacity .4s;
    text-shadow:0 0 5px rgba(0,255,0,.4);
  }
  .progress-pill,.info-pill{left:14px}
  .julia-pill{right:14px;display:none}
  .info-pill span{opacity:.55}
  .progress-pill .bar{width:74px;height:8px;border-radius:0;background:#0c2a12;border:1px solid var(--line);overflow:hidden}
  .progress-pill .bar i{display:block;height:100%;width:0%;background:var(--accent);box-shadow:0 0 8px var(--accent);transition:width .12s linear}

  /* ---------- Sidebar sections ---------- */
  .section{margin-bottom:24px}
  .section-head{
    font-family:var(--pixel);font-weight:400;font-size:10px;letter-spacing:1px;
    text-transform:uppercase;color:var(--accent-deep);margin:0 0 15px;
    display:flex;align-items:center;gap:10px;
    text-shadow:0 0 7px rgba(0,143,17,.5);
  }
  .section-head::before{content:"//"}
  .section-head::after{content:"";flex:1;height:0;border-top:1px dashed var(--line-dash)}

  /* Seed */
  .seed-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .seed-display{
    flex:1;font-family:var(--mono);font-weight:400;font-size:27px;
    background:#0a0f0a;border:1px solid var(--line);border-radius:0;
    padding:2px 14px;text-align:center;letter-spacing:3px;color:var(--ink);
    text-shadow:var(--glow);
  }
  .iconbtn{
    width:40px;height:40px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel-soft);
    border-radius:0;cursor:pointer;font-size:20px;color:var(--ink);
    display:flex;align-items:center;justify-content:center;transition:.12s;font-family:var(--mono);
  }
  .iconbtn:hover{background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent);box-shadow:var(--glow)}
  .iconbtn:active{transform:translateY(1px)}
  .seed-jump{display:flex;gap:8px}
  .seed-jump input{
    flex:1;min-width:0;font-family:var(--mono);font-size:19px;
    border:1px solid var(--line);border-radius:0;padding:3px 12px;background:#0a0f0a;color:var(--ink);
  }
  .seed-jump input:focus{outline:none;border-color:var(--accent-deep);box-shadow:0 0 0 1px var(--accent-deep),0 0 10px rgba(0,255,0,.25)}

  /* Buttons (bracketed, terminal style) */
  .btn{
    font-family:var(--mono);font-weight:400;font-size:19px;cursor:pointer;
    border-radius:0;padding:3px 14px;border:1px solid var(--line);background:var(--panel-soft);
    color:var(--ink);transition:.12s;letter-spacing:.5px;
  }
  .btn:hover{background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent);box-shadow:var(--glow)}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:#0a0f0a}

  /* preset / mode chips */
  .presets{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
  .preset-btn{
    font-family:var(--mono);font-size:18px;font-weight:400;
    padding:1px 11px;border:1px solid var(--line);border-radius:0;
    background:var(--panel-soft);color:var(--ink);cursor:pointer;transition:.12s;letter-spacing:.5px;
  }
  .preset-btn:hover{background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent)}
  .preset-btn.active{background:#0b1620;border-color:var(--cyan-deep);color:var(--cyan);box-shadow:0 0 8px rgba(107,199,255,.3)}
  .mode-row{display:flex;gap:8px;margin-bottom:8px}
  .mode-btn{
    flex:1;font-family:var(--mono);font-size:19px;font-weight:400;
    padding:4px 8px;border:1px solid var(--line);border-radius:0;
    background:var(--panel-soft);color:var(--ink);cursor:pointer;transition:.12s;text-align:center;
  }
  .mode-btn:hover{background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent)}
  .mode-btn.active{background:#0b1620;border-color:var(--cyan-deep);color:var(--cyan);box-shadow:0 0 8px rgba(107,199,255,.3)}

  /* bracket decoration on actionable text buttons */
  .btn::before,.preset-btn::before,.mode-btn::before{content:"[ ";opacity:.5}
  .btn::after,.preset-btn::after,.mode-btn::after{content:" ]";opacity:.5}

  .julia-c-row{
    font-family:var(--mono);font-size:17px;color:var(--muted);
    background:#0a0f0a;border:1px solid var(--line);border-radius:0;
    padding:6px 12px;display:none;
  }
  .julia-c-row.show{display:block}
  .julia-c-val{font-weight:400;color:var(--cyan)}

  /* Parameters */
  .control-group{margin-bottom:14px}
  .control-group label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:19px;color:var(--ink);margin-bottom:5px;letter-spacing:.5px;
  }
  .value-display{
    font-family:var(--mono);font-weight:400;font-size:17px;color:var(--cyan);
    background:#0b1620;border:1px solid var(--cyan-deep);border-radius:0;padding:0 8px;min-width:48px;text-align:center;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:0;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--fill,40%),#0c2a12 var(--fill,40%),#0c2a12 100%);
    border:1px solid var(--line);
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:20px;border-radius:0;
    background:var(--ink);border:1px solid #003f00;box-shadow:0 0 8px rgba(0,255,0,.65);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:20px;border-radius:0;background:var(--ink);border:1px solid #003f00;
    box-shadow:0 0 8px rgba(0,255,0,.65);cursor:pointer;
  }
  input[type=range]::-moz-range-track{height:8px;border-radius:0;background:#0c2a12}

  /* Palette swatches */
  .swatches{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .swatch{
    width:34px;height:34px;border-radius:0;cursor:pointer;border:1px solid var(--line);
    box-shadow:0 0 0 1px #000;transition:.12s;position:relative;
  }
  .swatch:hover{transform:translateY(-2px);box-shadow:0 0 10px rgba(0,255,0,.3)}
  .swatch.active{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 10px rgba(107,199,255,.4)}

  /* Colour pickers (crenate) */
  .color-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .color-cell{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:18px;color:var(--muted)}
  .color-cell input[type=color]{
    -webkit-appearance:none;appearance:none;width:30px;height:30px;border:none;border-radius:0;
    background:none;cursor:pointer;padding:0;flex:0 0 auto;
  }
  .color-cell input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  .color-cell input[type=color]::-webkit-color-swatch{border:1px solid var(--line);border-radius:0}
  .color-cell input[type=color]::-moz-color-swatch{border:1px solid var(--line);border-radius:0}

  /* Actions */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions .btn{width:100%;text-align:center}
  .actions .primary{
    grid-column:1 / -1;background:var(--accent-wash);border-color:var(--accent-deep);color:var(--accent);font-weight:400;
    text-shadow:var(--glow);
  }
  .actions .primary:hover{background:#0f3a18;border-color:var(--accent);box-shadow:0 0 14px rgba(0,255,0,.35)}

  .hint{font-family:var(--mono);font-size:17px;color:var(--muted);margin-top:14px;line-height:1.4;letter-spacing:.3px}
  .hint::before{content:"> ";color:var(--accent-deep)}

  /* error overlay (vermiculate) */
  .err{display:none;position:absolute;inset:0;background:#0a0a0a;color:#ff5f56;font-family:var(--mono);font-size:19px;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.6}
  .err.show{display:flex}

  aside::-webkit-scrollbar{width:12px}
  aside::-webkit-scrollbar-track{background:#0b0b0b}
  aside::-webkit-scrollbar-thumb{background:#1f3d1f;border-radius:0;border:3px solid var(--panel)}

  @media (max-width:880px){
    .app{flex-direction:column}
    aside{width:100%;flex:none;height:auto;position:static;border-right:none;border-bottom:2px solid var(--line)}
    main{padding:18px}
  }
</style>
</head>
<body>

<header>
  <svg class="mark" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
    <g fill="none" stroke="#00ff00" stroke-width="2" stroke-linecap="round">
      <path d="M15 3 C 9 9, 21 9, 15 15 C 9 21, 21 21, 15 27"/>
      <path d="M3 15 C 9 9, 9 21, 15 15 C 21 9, 21 21, 27 15"/>
    </g>
  </svg>
  <div class="titlewrap">
    <span class="title">Abyss</span>
    <span class="subtitle">fractal infinity — z &#8614; z&#178; + c</span>
  </div>
  <div class="header-spacer"></div>
  <span class="badge">generative · infinite · WebGL</span>
</header>

<div class="app">
<aside>

  <div class="section">
    <p class="section-head">Location</p>
    <div class="presets" id="preset-list"></div>
  </div>

  <div class="section">
    <p class="section-head">Mode</p>
    <div class="mode-row">
      <div class="mode-btn active" id="mode-mandelbrot">Mandelbrot</div>
      <div class="mode-btn" id="mode-julia">Julia set</div>
    </div>
    <div class="julia-c-row" id="julia-c-row">
      c = <span class="julia-c-val" id="julia-c-val">—</span>
      <br><small style="color:var(--muted);font-size:11px">Click Mandelbrot to set c</small>
    </div>
  </div>

  <div class="section">
    <p class="section-head">Rendering</p>
    <div class="control-group">
      <label>Max iterations <span class="value-display" id="val-iter">300</span></label>
      <input type="range" id="sl-iter" min="50" max="1000" step="50" value="300">
    </div>
    <div class="control-group">
      <label>Color speed <span class="value-display" id="val-cspeed">1.0</span></label>
      <input type="range" id="sl-cspeed" min="0" max="5" step="0.1" value="1.0">
    </div>
  </div>

  <div class="section">
    <p class="section-head">Palette</p>
    <div class="swatches" id="palette-list"></div>
  </div>

  <div class="section">
    <p class="section-head">Actions</p>
    <div class="actions">
      <button class="btn primary" id="btn-animate">Animate colors</button>
      <button class="btn ghost" id="btn-home">Reset view</button>
      <button class="btn ghost" id="btn-download">Download PNG</button>
    </div>
    <p class="hint">Scroll to zoom &middot; drag to pan &middot; Mandelbrot mode: click to open Julia set for that point.</p>
  </div>

</aside>

<main>
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="info-pill" id="info-pill">
      <span id="info-zoom">zoom 1.0×</span>
      <span id="info-mode">Mandelbrot</span>
    </div>
    <div class="julia-pill" id="julia-pill"></div>
  </div>
</main>
</div>

<script>
'use strict';

/* ======================================================
   CONFIGURATION
   ====================================================== */

// Named locations in the Mandelbrot set (center + scale in complex units)
const LOCATIONS = [
  { name:'Overview',  cx:-0.5,          cy:0.0,           sc:4.0  },
  { name:'Seahorse',  cx:-0.7436438870,  cy:0.1318259042,  sc:2.4e-4 },
  { name:'Elephant',  cx: 0.3750001200, cy:-0.0000001,    sc:4e-3  },
  { name:'Lightning', cx:-0.1565,        cy:1.0322,        sc:0.014 },
  { name:'Spiral',    cx:-1.40115519,    cy: 0.00000001,   sc:4e-5  },
  { name:'Tentacles', cx:-0.74543,       cy: 0.11307,      sc:3e-3  },
];

// Cosine palette coefficients: col = a + b*cos(2π*(c*t + d))
// Each entry: [a, b, c, d] as vec3 arrays
const PALETTES = [
  {
    name: 'Phosphor',
    a:[0.08,0.42,0.16], b:[0.08,0.50,0.18], c:[1.0,1.0,1.0], d:[0.00,0.12,0.22],
    inside: [0.01,0.025,0.01],
  },
  {
    name: 'Void',
    a:[0.1,0.1,0.2], b:[0.3,0.3,0.4], c:[1.0,1.0,1.0], d:[0.0,0.15,0.3],
    inside: [0.02,0.03,0.08],
  },
  {
    name: 'Ember',
    a:[0.2,0.1,0.05], b:[0.4,0.2,0.1], c:[1.0,1.0,0.5], d:[0.0,0.1,0.2],
    inside: [0.06,0.02,0.01],
  },
  {
    name: 'Aurora',
    a:[0.1,0.1,0.15], b:[0.2,0.4,0.2], c:[1.0,0.7,1.0], d:[0.3,0.0,0.6],
    inside: [0.02,0.04,0.06],
  },
  {
    name: 'Abyssal',
    a:[0.1,0.05,0.15], b:[0.35,0.1,0.4], c:[1.0,1.0,0.8], d:[0.0,0.25,0.5],
    inside: [0.04,0.01,0.06],
  },
  {
    name: 'Copper',
    a:[0.15,0.1,0.05], b:[0.4,0.25,0.1], c:[0.9,1.0,1.0], d:[0.0,0.15,0.25],
    inside: [0.05,0.03,0.01],
  },
  {
    name: 'Jade',
    a:[0.05,0.15,0.12], b:[0.1,0.35,0.3], c:[1.0,0.9,0.8], d:[0.2,0.0,0.15],
    inside: [0.01,0.05,0.04],
  },
];

/* ======================================================
   GLSL SHADERS
   ====================================================== */
const VERT_SRC = `#version 300 es
in vec2 a_pos;
void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }`;

const FRAC_SRC = `#version 300 es
precision highp float;

uniform vec2  u_center;
uniform float u_scale;
uniform vec2  u_res;
uniform float u_maxIter;
uniform float u_time;
uniform int   u_mode;   // 0=Mandelbrot, 1=Julia
uniform vec2  u_julia;
uniform vec3  u_pa, u_pb, u_pc, u_pd;  // cosine palette coefficients
uniform vec3  u_inside;  // interior color

out vec4 fragColor;

#define PI 3.14159265358979323846

vec3 pal(float t) {
  return u_pa + u_pb * cos(2.0 * PI * (u_pc * t + u_pd));
}

vec3 fractal(vec2 c, vec2 z) {
  float minR   = 1e9;
  float minAx  = 1e9;
  float iter   = 0.0;

  for (int i = 0; i < 1000; i++) {
    if (float(i) >= u_maxIter) break;
    float r2 = dot(z, z);
    if (r2 > 256.0) break;
    minR  = min(minR,  sqrt(r2));
    minAx = min(minAx, abs(z.y));
    // z = z² + c
    z = vec2(z.x*z.x - z.y*z.y + c.x, 2.0*z.x*z.y + c.y);
    iter++;
  }

  if (iter >= u_maxIter) {
    // Inside: subtle glow from orbit proximity
    float glow = exp(-minR * 4.0) + 0.4 * exp(-minAx * 6.0);
    return u_inside * (0.5 + 1.5 * clamp(glow, 0.0, 1.0));
  }

  // Smooth escape count (Hubbard-Douady potential)
  float log_zn = log(dot(z, z)) * 0.5;
  float nu = log(log_zn / log(2.0)) / log(2.0);
  float smooth_i = iter + 1.0 - nu;

  // Two color layers blended
  float t1 = fract(smooth_i * 0.04 + u_time);
  vec3 bandCol = pal(t1);

  // Orbit trap ring (circles at integer |z|)
  float ring = exp(-fract(minR) * 12.0);
  float axGlow = exp(-minAx * 3.0);

  vec3 trapCol = pal(fract(smooth_i * 0.02 + u_time + 0.5));
  vec3 col = mix(bandCol, trapCol, ring * 0.45 + axGlow * 0.2);

  // Brightness modulation near boundary
  float boundary = exp(-smooth_i * 0.05);
  col *= 0.9 + 0.5 * boundary;

  return col;
}

void main() {
  // gl_FragCoord: (0,0) at bottom-left, y increases upward → matches complex plane
  vec2 screenUV = gl_FragCoord.xy / u_res;
  vec2 c_plane  = u_center + (screenUV - 0.5) * u_scale;

  vec3 col;
  if (u_mode == 0) {
    col = fractal(c_plane, vec2(0.0));   // Mandelbrot: c = pixel, z₀ = 0
  } else {
    col = fractal(u_julia, c_plane);     // Julia: c = fixed, z₀ = pixel
  }

  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

/* ======================================================
   WEBGL SETUP
   ====================================================== */
const canvas = document.getElementById('c');

const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true });
if (!gl) {
  const msg = document.getElementById('stage');
  msg.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;color:#ff5f56;font-family:VT323,monospace;font-size:19px;padding:30px;text-align:center;line-height:1.6">&gt; ERROR: WebGL 2 is required. Please use Chrome, Firefox, or Safari 15+.</div>';
}

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function makeProgram(vSrc, fSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vSrc));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p));
    return null;
  }
  return p;
}

let prog;
if (gl) prog = makeProgram(VERT_SRC, FRAC_SRC);

const quadBuf = gl && gl.createBuffer();
if (gl && quadBuf) {
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
}

/* ======================================================
   STATE
   ====================================================== */
let loc     = LOCATIONS[0];
let palette = PALETTES[0];
let center  = { x: loc.cx, y: loc.cy };
let scale   = loc.sc;
let mode    = 0;  // 0=Mandelbrot, 1=Julia
let juliaC  = { x: -0.7, y: 0.27015 };
let maxIter = 300;
let colorSpeed = 1.0;
let animating  = false;
let colorPhase = 0;
let lastT      = null;
let rafId      = null;

/* ======================================================
   RENDER
   ====================================================== */
function render(ts) {
  if (!prog || !gl || !canvas.width) { rafId = requestAnimationFrame(render); return; }

  if (lastT === null) lastT = ts;
  const dt = (ts - lastT) * 0.001;  // seconds
  lastT = ts;

  if (animating) colorPhase += dt * colorSpeed * 0.2;

  const W = canvas.width, H = canvas.height;
  gl.viewport(0, 0, W, H);
  gl.useProgram(prog);

  const posAttr = gl.getAttribLocation(prog, 'a_pos');
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(posAttr);
  gl.vertexAttribPointer(posAttr, 2, gl.FLOAT, false, 0, 0);

  gl.uniform2f(gl.getUniformLocation(prog, 'u_center'), center.x, center.y);
  gl.uniform1f(gl.getUniformLocation(prog, 'u_scale'),  scale);
  gl.uniform2f(gl.getUniformLocation(prog, 'u_res'),    W, H);
  gl.uniform1f(gl.getUniformLocation(prog, 'u_maxIter'), maxIter);
  gl.uniform1f(gl.getUniformLocation(prog, 'u_time'),   colorPhase);
  gl.uniform1i(gl.getUniformLocation(prog, 'u_mode'),   mode);
  gl.uniform2f(gl.getUniformLocation(prog, 'u_julia'),  juliaC.x, juliaC.y);

  const p = palette;
  gl.uniform3fv(gl.getUniformLocation(prog, 'u_pa'), p.a);
  gl.uniform3fv(gl.getUniformLocation(prog, 'u_pb'), p.b);
  gl.uniform3fv(gl.getUniformLocation(prog, 'u_pc'), p.c);
  gl.uniform3fv(gl.getUniformLocation(prog, 'u_pd'), p.d);
  gl.uniform3fv(gl.getUniformLocation(prog, 'u_inside'), p.inside);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  updateInfoPill();
  rafId = requestAnimationFrame(render);
}

/* ======================================================
   CANVAS SIZING
   ====================================================== */
function resizeCanvas() {
  const stage = document.getElementById('stage');
  const r = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sz = Math.round(Math.min(r.width, r.height) * dpr);
  if (canvas.width !== sz || canvas.height !== sz) {
    canvas.width  = sz;
    canvas.height = sz;
  }
}

/* ======================================================
   UI HELPERS
   ====================================================== */
function updateInfoPill() {
  const zoomFactor = 4.0 / scale;  // relative to overview
  let zStr;
  if (zoomFactor >= 1e6)      zStr = (zoomFactor/1e6).toFixed(1) + 'M×';
  else if (zoomFactor >= 1e3) zStr = (zoomFactor/1e3).toFixed(1) + 'k×';
  else                        zStr = zoomFactor.toFixed(1) + '×';
  document.getElementById('info-zoom').textContent = 'zoom ' + zStr;
  document.getElementById('info-mode').textContent = mode === 0 ? 'Mandelbrot' : 'Julia';

  const jp = document.getElementById('julia-pill');
  if (mode === 1) {
    jp.style.display = 'block';
    jp.textContent = `c = ${juliaC.x.toFixed(5)} ${juliaC.y >= 0 ? '+' : ''}${juliaC.y.toFixed(5)}i`;
  } else {
    jp.style.display = 'none';
  }
}

function setFill(el) {
  const min = parseFloat(el.min), max = parseFloat(el.max), val = parseFloat(el.value);
  el.style.setProperty('--fill', ((val-min)/(max-min)*100).toFixed(1)+'%');
}

function goToLocation(l) {
  loc = l;
  center = { x: l.cx, y: l.cy };
  scale  = l.sc;
  document.querySelectorAll('.preset-btn').forEach((b,i) => {
    b.classList.toggle('active', LOCATIONS[i] === l);
  });
}

/* ======================================================
   BUILD PRESET / PALETTE UI
   ====================================================== */
function buildPresets() {
  const container = document.getElementById('preset-list');
  LOCATIONS.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'preset-btn' + (i===0?' active':'');
    b.textContent = l.name;
    b.onclick = () => goToLocation(l);
    container.appendChild(b);
  });
}

function palettePreviewGradient(p) {
  // Sample the cosine palette at a few points for CSS gradient preview
  function sample(t) {
    const r = Math.round((p.a[0] + p.b[0]*Math.cos(2*Math.PI*(p.c[0]*t + p.d[0])))*255);
    const g = Math.round((p.a[1] + p.b[1]*Math.cos(2*Math.PI*(p.c[1]*t + p.d[1])))*255);
    const b = Math.round((p.a[2] + p.b[2]*Math.cos(2*Math.PI*(p.c[2]*t + p.d[2])))*255);
    return `rgb(${Math.min(255,Math.max(0,r))},${Math.min(255,Math.max(0,g))},${Math.min(255,Math.max(0,b))})`;
  }
  const stops = [0, 0.25, 0.5, 0.75, 1.0].map(t => sample(t)).join(', ');
  return `linear-gradient(135deg, ${stops})`;
}

function buildPalettes() {
  const container = document.getElementById('palette-list');
  PALETTES.forEach((p, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i===0?' active':'');
    sw.title = p.name;
    sw.style.background = palettePreviewGradient(p);
    sw.onclick = () => {
      palette = p;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    };
    container.appendChild(sw);
  });
}

/* ======================================================
   MODE TOGGLE
   ====================================================== */
function setMode(m) {
  mode = m;
  document.getElementById('mode-mandelbrot').classList.toggle('active', m===0);
  document.getElementById('mode-julia').classList.toggle('active', m===1);
  document.getElementById('julia-c-row').classList.toggle('show', m===1);
  if (m === 1) {
    // Reset Julia view to a nice starting scale
    center = { x: 0, y: 0 };
    scale  = 4.0;
    document.getElementById('julia-c-val').textContent =
      `${juliaC.x.toFixed(5)} ${juliaC.y>=0?'+':''}${juliaC.y.toFixed(5)}i`;
  }
}

document.getElementById('mode-mandelbrot').onclick = () => setMode(0);
document.getElementById('mode-julia').onclick = () => setMode(1);

/* ======================================================
   POINTER INTERACTION
   ====================================================== */
// Map canvas pixel → complex coordinate (Y axis: canvas Y+ = complex Y-)
function pixToComplex(px, py) {
  const r = canvas.getBoundingClientRect();
  const nx = (px - r.left) / r.width  - 0.5;
  const ny = 0.5 - (py - r.top) / r.height;  // flip Y
  return { x: center.x + nx * scale, y: center.y + ny * scale };
}

let isDragging = false, dragStart = null, centerStart = null;

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 0.85 : 1/0.85;
  const m = pixToComplex(e.clientX, e.clientY);
  center.x = m.x + (center.x - m.x) * factor;
  center.y = m.y + (center.y - m.y) * factor;
  scale    *= factor;
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  isDragging  = true;
  dragStart   = { x: e.clientX, y: e.clientY };
  centerStart = { ...center };
});

canvas.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const r  = canvas.getBoundingClientRect();
  const dx = (e.clientX - dragStart.x) / r.width  * scale;
  const dy = (e.clientY - dragStart.y) / r.height * scale;
  center.x = centerStart.x - dx;
  center.y = centerStart.y + dy;  // flip Y
});

canvas.addEventListener('mouseup', e => {
  if (isDragging && Math.abs(e.clientX - dragStart.x) < 4 && Math.abs(e.clientY - dragStart.y) < 4) {
    // Treat as click: set Julia c from Mandelbrot view
    if (mode === 0) {
      juliaC = pixToComplex(e.clientX, e.clientY);
      setMode(1);
    }
  }
  isDragging = false;
});

canvas.addEventListener('dblclick', () => {
  if (mode === 1) setMode(0);
});

/* ======================================================
   SLIDERS
   ====================================================== */
function wireSlider(id, valId, digits, onChange) {
  const el = document.getElementById(id);
  function update() {
    const v = parseFloat(el.value);
    document.getElementById(valId).textContent = v.toFixed(digits);
    setFill(el);
    onChange(v);
  }
  el.addEventListener('input', update);
  setFill(el);
}

wireSlider('sl-iter',   'val-iter',   0, v => { maxIter = v; });
wireSlider('sl-cspeed', 'val-cspeed', 1, v => { colorSpeed = v; });

/* ======================================================
   ACTION BUTTONS
   ====================================================== */
document.getElementById('btn-animate').onclick = function() {
  animating = !animating;
  this.textContent = animating ? 'Pause colors' : 'Animate colors';
  if (animating) this.style.background = 'var(--accent)';
  else this.style.background = '';
};

document.getElementById('btn-home').onclick = () => goToLocation(LOCATIONS[0]);

document.getElementById('btn-download').onclick = () => {
  const url = canvas.toDataURL('image/png');
  const a   = document.createElement('a');
  a.href = url;
  const modeStr = mode === 0 ? 'mandelbrot' : `julia${juliaC.x.toFixed(4)}`;
  const zoomStr = (4/scale).toExponential(2).replace('+','');
  a.download = `abyss-${modeStr}-zoom${zoomStr}.png`;
  a.click();
};

/* ======================================================
   BOOTSTRAP
   ====================================================== */
buildPresets();
buildPalettes();

const ro = new ResizeObserver(() => { resizeCanvas(); });
ro.observe(document.getElementById('stage'));
resizeCanvas();

if (gl && prog) {
  requestAnimationFrame(render);
}
</script>
</body>
</html>
